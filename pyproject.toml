[project]
name = "factur-x"
# Version of the embedded upstream Python library. The independently versioned
# DigiTax API release is exposed by facturx/api.py and the repository Git tag.
version = "3.6"
description = "Factur-X and Order-X: electronic invoicing and ordering standards"
authors = [{name = "Alexis de Lattre", email = "alexis.delattre@akretion.com"}]
readme = "README.rst"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
keywords = ["e-invoice", "ZUGFeRD", "Factur-X", "Order-X", "e-procurement"]
license = {file = "LICENSE"}
# facturx/phase1/ (the DigiTax Phase 1 slice) uses PEP 604 `X | None` unions,
# which require 3.10+; this replaces the historical >=3.7 floor, which the
# core facturx/facturx.py library alone would still satisfy.
requires-python = ">=3.10"
dynamic = ["dependencies"]

# Needed if we enable facturx-webservice
# [project.optional-dependencies]
# web = [
#    "flask"
# ]

[project.urls]
Homepage = "https://github.com/digitax-project/facturx_apis"
Source = "https://github.com/digitax-project/facturx_apis"
Issues = "https://github.com/digitax-project/facturx_apis/issues"
Upstream = "https://github.com/akretion/factur-x"

[project.scripts]
facturx-pdfgen = "facturx.scripts.pdfgen:main"
facturx-pdfextractxml = "facturx.scripts.pdfextractxml:main"
facturx-xmlcheck = "facturx.scripts.xmlcheck:main"
# I consider the webservice scripts as a proof of concept, not real clean code
# facturx-webservice = "facturx.scripts.webservice:main"

[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = ["facturx"]
